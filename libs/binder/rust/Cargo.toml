[package]
name = "android-binder"
version = "0.1.0"
edition = "2021"

[dependencies]
binder-ndk-sys = { package = "android-binder-ndk-sys", path = "./sys" }
downcast-rs = "1.2.1"
libc = "0.2.159"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(android_vendor)", "cfg(android_ndk)", "cfg(android_vndk)", "cfg(trusty)"]
